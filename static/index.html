<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCP - pagina de test</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1d1d1f; --muted: #6e6e73; --card: #fff; --line: #d2d2d7;
    --l1: #c8f0c8; --l2: #e6f5b0; --l3: #fff0a0; --l4: #ffd0a0; --l5: #ffb0b0;
    --accent: #0a66c2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617; --fg: #f5f5f7; --muted: #a1a1a6; --card: #1f1f21; --line: #3a3a3c;
      --l1: #1f5a2a; --l2: #4a5a1a; --l3: #6a5a10; --l4: #7a3f12; --l5: #7a1f1f;
      --accent: #4ea1f3;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  textarea { width: 100%; min-height: 260px; resize: vertical; font: inherit; color: inherit;
             background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  select, input, button { font: inherit; }
  select, input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--card); color: inherit; }
  button { padding: 7px 16px; border: 0; border-radius: 8px; background: var(--accent);
           color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spread { justify-content: space-between; margin-top: 8px; }
  #out { white-space: pre-wrap; min-height: 260px; }
  .pending { opacity: .45; }
  .w { border-radius: 4px; padding: 0 1px; cursor: help; }
  .w1 { background: var(--l1); } .w2 { background: var(--l2); } .w3 { background: var(--l3); }
  .w4 { background: var(--l4); } .w5 { background: var(--l5); }
  .legend { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .legend:empty { display: none; }
  .legend span { display: inline-block; padding: 1px 8px; border-radius: 4px; margin: 2px 4px 2px 0;
                 font-size: 14px; }
  #msg { margin-top: 8px; font-size: 14px; }
  .out-wrap { position: relative; }
  .w.sel { outline: 2px solid var(--accent); }
  .w.fn { opacity: .75; }
  #pop { position: absolute; z-index: 5; min-width: 220px; max-width: 300px; padding: 10px 12px;
         background: var(--card); border: 1px solid var(--line); border-radius: 10px;
         box-shadow: 0 6px 24px rgba(0,0,0,.18); font-size: 14px; line-height: 1.45; }
  #pop .t { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  #pop .lv { display: inline-block; padding: 0 8px; border-radius: 4px; margin-bottom: 6px; }
  #pop .small { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .err { color: #c0392b; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Complexitate lexicala, 11 limbi</h1>
  <div class="muted">Pagina de test a API-ului. Interfata finala vine la Etapa 5.</div>

  <div id="down" class="card" style="margin-top:16px" hidden>
    Serverul e oprit momentan. Incearca din nou mai tarziu.
  </div>

  <form id="login" class="card row" style="margin-top:16px" hidden>
    <label for="code">Cod de acces:</label>
    <input id="code" type="password" autocomplete="current-password" required>
    <button type="submit">Intra</button>
    <span id="loginmsg" class="muted"></span>
  </form>

  <section id="app" hidden>
    <div class="grid">
      <div class="card">
        <div class="row">
          <select id="lang" aria-label="Limba"></select>
          <span id="langr" class="muted"></span>
        </div>
        <textarea id="text" style="margin-top:8px" placeholder="Lipeste un text..."></textarea>
        <div class="row spread">
          <span id="count" class="muted">0</span>
          <button id="go">Analizeaza</button>
        </div>
      </div>
      <div class="card">
        <div class="legend" id="legend"></div>
        <div class="out-wrap"><div id="out"></div><div id="pop" hidden></div></div>
        <div id="msg" class="muted"></div>
      </div>
    </div>
    <p class="muted">Scorul e relativ la limba aleasa; nu compara scoruri intre limbi.</p>
  </section>
</main>
<script>
// The API: the PC, through Tailscale Funnel. The page itself may be served from Vercel or from the
// PC; the API allows the Vercel origin through CORS (server.py).
const API = "https://lcp.tail6e4ef5.ts.net";
const LABELS = {1: "foarte usor", 2: "usor", 3: "neutru", 4: "dificil", 5: "foarte dificil"};
let INFO = null, code = "", BUSY = false;          // BUSY: an analysis is streaming
try { code = localStorage.getItem("lcp_code") || ""; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
// The API counts characters as Unicode code points (Python), JavaScript strings as UTF-16 units:
// an emoji is 1 for the server and 2 here. cpLen counts like the server; cpMap(text)[i] is the
// UTF-16 index of code point i.
const cpLen = s => { let n = 0; for (const _ of s) n++; return n; };
function cpMap(text) {
  const m = [0];
  let u = 0;
  for (const ch of text) { u += ch.length; m.push(u); }
  return m;
}

async function api(path, opts = {}) {
  const r = await fetch(API + path, {...opts, headers: {"X-Access-Code": code, ...(opts.headers || {})}});
  return r;
}

function showApp() {
  $("login").hidden = true; $("app").hidden = false;
  const cur = $("lang").value ||
    (() => { try { return localStorage.getItem("lcp_lang"); } catch (e) { return null; } })();
  $("lang").innerHTML = INFO.languages.map(l => `<option value="${l.code}">${l.name}</option>`).join("");
  if (cur && INFO.languages.some(l => l.code === cur)) $("lang").value = cur;
  showLang(); count();
}

async function start() {
  // With a saved code the page shows at once from the cached language list; the list is then
  // fetched again (one request through the tunnel), which also checks the code and the server.
  if (code) {
    try { INFO = JSON.parse(localStorage.getItem("lcp_info") || "null"); } catch (e) {}
    if (INFO) showApp();
  }
  let r;
  try { r = await api("/api/languages"); }
  catch (e) { if (INFO) note("Serverul nu raspunde (oprit momentan)."); else $("down").hidden = false; return; }
  if (r.status === 401 || r.status === 429) {
    $("app").hidden = true; $("login").hidden = false;
    if (r.status === 429) $("loginmsg").textContent = "Prea multe incercari; revino mai tarziu.";
    return;
  }
  if (!r.ok) { note(r.status === 503 ? "Serverul porneste; revino in cateva zeci de secunde."
                                     : `Serverul a raspuns cu eroarea ${r.status}.`); return; }
  INFO = await r.json();
  try { localStorage.setItem("lcp_info", JSON.stringify(INFO)); } catch (e) {}
  showApp();
}
function note(t) {
  if ($("app").hidden) { $("down").textContent = t; $("down").hidden = false; }
  else { $("msg").textContent = t; $("msg").className = "err"; }
}

$("login").addEventListener("submit", async ev => {
  ev.preventDefault();
  code = $("code").value;
  let r;
  try {
    r = await fetch(API + "/api/auth", {method: "POST", headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify({code})});
  } catch (e) { $("loginmsg").textContent = "Serverul nu raspunde (oprit momentan)."; return; }
  if (r.ok) { try { localStorage.setItem("lcp_code", code); } catch (e) {} start(); }
  else $("loginmsg").textContent = r.status === 429 ? "Prea multe incercari; revino mai tarziu."
                                                     : "Cod gresit.";
});

function lang() { return INFO.languages.find(l => l.code === $("lang").value); }
function showLang() {
  const l = lang();
  $("langr").textContent = `r = ${l.r.toFixed(2)} pe setul de test`;
  try { localStorage.setItem("lcp_lang", l.code); } catch (e) {}
  count();
}
function count() {
  if (!INFO) return;
  const n = cpLen($("text").value), l = lang();
  $("count").textContent = `${n} / ${INFO.max_chars} caractere` + (n > l.warn_chars ? " (text lung)" : "");
  $("go").disabled = BUSY || n === 0 || n > INFO.max_chars;
}
$("lang").addEventListener("change", showLang);
$("text").addEventListener("input", count);
$("text").addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") $("go").click(); });

function render(text, pend, words) {
  // the text with its scored words coloured; parts not analysed yet are faded.
  // Offsets are UTF-16 indices here (converted from the API's code points).
  // pend: [{start, end}] sorted, not overlapping; chunks are visited in increasing offset.
  let html = "", pos = 0, pi = 0;
  const chunk = (a, b) => {           // text[a:b], cut at the edges of the pending spans
    let out = "";
    while (a < b) {
      while (pi < pend.length && pend[pi].end <= a) pi++;
      const p = pend[pi];
      if (p && p.start <= a) {
        const e = Math.min(b, p.end);
        out += `<span class="pending">${esc(text.slice(a, e))}</span>`;
        a = e;
      } else {
        const e = p ? Math.min(b, p.start) : b;
        out += esc(text.slice(a, e));
        a = e;
      }
    }
    return out;
  };
  SHOWN = [...words].sort((a, b) => a.start - b.start);
  SHOWN.forEach((w, k) => {
    if (w.start < pos) return;
    html += chunk(pos, w.start);
    html += `<span class="w w${w.level}${w.function ? " fn" : ""}" data-k="${k}" tabindex="0">` +
            `${esc(text.slice(w.start, w.end))}</span>`;
    pos = w.end;
  });
  html += chunk(pos, text.length);
  $("out").innerHTML = html;
  const n = [0, 0, 0, 0, 0];
  let nf = 0;
  for (const w of words) { n[w.level - 1]++; if (w.function) nf++; }
  $("legend").innerHTML = [1, 2, 3, 4, 5].map(k => `<span class="w${k}">${k} ${LABELS[k]}: ` +
    `${n[k - 1]}${k === 1 && nf ? ` (${nf} functionale)` : ""}</span>`).join("");
}

// popover with the details of a word, on click / tap / Enter
let SHOWN = [], SEL = null;            // SEL: start offset of the word whose popover is open
function rerender(text, pend, words) {
  // redraw while the analysis streams in, keeping an open popover on the same word
  const keep = $("pop").hidden ? null : SEL;
  render(text, pend, words);
  if (keep === null) return;
  const k = SHOWN.findIndex(w => w.start === keep);
  const el = k >= 0 && document.querySelector(`.w[data-k="${k}"]`);
  if (el) openPop(el); else closePop();
}
function closePop() {
  $("pop").hidden = true;
  document.querySelectorAll(".w.sel").forEach(e => e.classList.remove("sel"));
}
function openPop(el) {
  const w = SHOWN[+el.dataset.k];
  if (!w) return;
  closePop();
  SEL = w.start;
  el.classList.add("sel");
  const rows = w.function
    ? `<div>cuvant functional, neevaluat de model</div>`
    : `<div>scor <b>${w.score.toFixed(2)}</b> (0 = foarte usor, 1 = foarte dificil)</div>` +
      `<div>lema: ${esc(w.lemma || "-")}</div>` +
      `<div>frecventa Zipf: ${w.zipf == null ? "indisponibila" : w.zipf}</div>` +
      `<div class="small">A ${w.A} &middot; B ${w.B} &middot; fuziune ${w.fused}` +
      `${w.cropped ? " &middot; context scurtat" : ""}</div>`;
  const pop = $("pop");
  pop.innerHTML = `<div class="t">${esc(w.text)}</div>` +
    `<span class="lv w${w.level}">${w.level} ${LABELS[w.level]}</span>${rows}`;
  pop.hidden = false;
  const wrap = el.closest(".out-wrap").getBoundingClientRect(), r = el.getBoundingClientRect();
  let left = r.left - wrap.left, top = r.bottom - wrap.top + 6;
  left = Math.max(0, Math.min(left, wrap.width - pop.offsetWidth));
  pop.style.left = left + "px"; pop.style.top = top + "px";
}
$("out").addEventListener("click", e => {
  const el = e.target.closest(".w");
  if (el) { e.stopPropagation(); openPop(el); }
});
$("out").addEventListener("keydown", e => {
  const el = e.target.closest(".w");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPop(el); }
});
document.addEventListener("click", e => { if (!e.target.closest("#pop")) closePop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });

$("go").addEventListener("click", async () => {
  if (BUSY) return;
  const text = $("text").value, l = lang(), n = cpLen(text);
  if (n > l.warn_chars) {
    const min = Math.max(1, Math.round(n / 1000 * (l.est_s_per_1000_chars || 20) / 60));
    if (!confirm(`Textul are ${n} caractere; analiza dureaza aproximativ ${min} min. Continui?`)) return;
  }
  BUSY = true;
  $("go").disabled = true; $("msg").textContent = "Se analizeaza..."; $("msg").className = "muted";
  const cp = cpMap(text), at = i => cp[i] ?? text.length;   // API offsets -> UTF-16
  const span = x => ({...x, start: at(x.start), end: at(x.end)});
  let paras = [{start: 0, end: text.length}];        // paragraphs not segmented yet
  const sents = new Map(), words = [];               // sentence i -> span, while not done
  const pend = () => [...paras, ...sents.values()].sort((a, b) => a.start - b.start);
  let n_done = 0, finished = false;
  render(text, pend(), words);
  try {
    const r = await api("/api/analyze", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({lang: l.code, text})});
    if (r.status === 401) { try { localStorage.removeItem("lcp_code"); } catch (e) {} location.reload(); return; }
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || `HTTP ${r.status}`); }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let k;
      while ((k = buf.indexOf("\n")) >= 0) {
        const ev = JSON.parse(buf.slice(0, k));
        buf = buf.slice(k + 1);
        if (ev.type === "queued") {
          $("msg").textContent = `In asteptare (pozitia ${ev.position})...`;
        } else if (ev.type === "paragraphs") {
          paras = ev.paragraphs.map(p => span({i: p.i, start: p.start, end: p.end}));
        } else if (ev.type === "sentences") {
          paras = paras.filter(p => p.i !== ev.paragraph);
          for (const s of ev.sentences) sents.set(s.i, span({start: s.start, end: s.end}));
        } else if (ev.type === "sentence") {
          sents.delete(ev.i); words.push(...ev.words.map(span)); n_done++;
          $("msg").textContent = `Se analizeaza... ${n_done} propozitii gata`;
        } else if (ev.type === "done") {
          finished = true;
          $("msg").textContent = `Gata: ${ev.content_words} cuvinte in ${ev.timings.total_s.toFixed(1)} s.`;
        } else if (ev.type === "error") {
          throw new Error(ev.message);
        }
        if (ev.type !== "ping") rerender(text, pend(), words);
      }
    }
    if (!finished) throw new Error("analiza s-a intrerupt (serverul a inchis conexiunea).");
  } catch (e) {
    $("msg").textContent = e instanceof TypeError ? "Serverul nu raspunde (oprit momentan)."
                                                  : "Eroare: " + e.message;
    $("msg").className = "err";
  } finally { BUSY = false; count(); }
});

start();
</script>
</body>
</html>
